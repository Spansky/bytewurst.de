# Auslieferung der vorgerenderten Seiten aus scripts/prerender.mjs.
#
# Jede Route liegt als eigener Ordner mit index.html vor (/funktionen/, /preise/,
# /impressum/, /datenschutz/), dazu 404.html. Kein Rückfall auf eine zentrale
# index.html: unbekannte Pfade bekommen echte 404.
#
# add_header wird NICHT in location-Blöcke vererbt, sobald ein Block selbst
# add_header setzt. Die Sicherheits-Header stehen deshalb in jedem Block erneut
# (LESSONS 2026-09-06, Sicherheits-Header).

server {
    listen 3000 default_server;
    listen [::]:3000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Coolify terminiert TLS davor, daher hier nur HTTP. Relative Umleitungen,
    # damit hinter dem Proxy nicht auf http:// oder Port 3000 gezeigt wird.
    absolute_redirect off;

    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    charset utf-8;
    charset_types text/plain text/xml application/json application/manifest+json;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;

    # Seiten ohne Schrägstrich auf die kanonische Adresse mit Schrägstrich
    location ~ ^/(funktionen|preise|impressum|datenschutz)$ {
        return 301 /$1/;
    }

    # ── Gehashte Bauartefakte: dürfen dauerhaft im Cache bleiben ───
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Schriften und Bilder ohne Hash: eine Woche, dann nachfragen ─
    location ~ ^/(fonts|bilder)/ {
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/(favicon\.ico|favicon\.svg|favicon-96x96\.png|apple-touch-icon\.png|icon-192\.png|icon-512\.png|og-image\.jpg)$ {
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/(robots\.txt|sitemap\.xml|site\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Seiten: nie cachen, sonst zeigen Browser nach einem Deploy auf
    #    veraltete Asset-Namen ─────────────────────────────────────
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri $uri/index.html =404;
    }

    # =404 statt Weiterleitung: der Statuscode bleibt 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Punktdateien nie ausliefern
    location ~ /\. {
        deny all;
    }
}
